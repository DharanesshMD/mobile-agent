<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="t d">
  <title id="t">Mobile Agent architecture</title>
  <desc id="d">You talk to a chat in the browser or the Mobile Agent app. One service holds the orchestrator, the worker, per-phone queues, the vault, the game guard, escalation and web options. It drives an emulator, a games phone, your real phone and optional adb phones, and calls Meta's Muse models.</desc>
  <style>
    :root { --bg: #ffffff; --panel: #f3f4f8; --line: #b9bdcc; --ink: #1c1f2b; --dim: #5b6074; --accent: #5b6cf0; --meta: #0a7cff; --ok: #1f9d6b; --warn: #c27a00; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1016; --panel: #1a1d29; --line: #3a3f55; --ink: #eceef6; --dim: #9aa0b8; --accent: #8c98ff; --meta: #5aa8ff; --ok: #46d19a; --warn: #f0b04a; } }
    .bg { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
    .big { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 5; }
    .t { fill: var(--ink); font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .s { fill: var(--dim); font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .h { fill: var(--dim); font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .08em; }
    .ln { stroke: var(--accent); stroke-width: 1.8; fill: none; }
    .lm { stroke: var(--meta); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .meta { fill: none; stroke: var(--meta); stroke-width: 1.6; }
    .mt { fill: var(--meta); font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .safe { fill: none; stroke: var(--ok); stroke-width: 1.6; }
    .st { fill: var(--ok); font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ah { fill: var(--accent); } .amh { fill: var(--meta); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="amh"/></marker>
  </defs>
  <rect class="bg" width="1000" height="650"/>

  <!-- You -->
  <text class="h" x="30" y="34">YOU</text>
  <rect class="box" x="30" y="48" width="190" height="104" rx="10"/>
  <text class="t" x="46" y="74">Web chat</text>
  <text class="s" x="46" y="94">text, mic, pictures (paste,</text>
  <text class="s" x="46" y="110">drop, camera), approval cards,</text>
  <text class="s" x="46" y="126">live view, Take control</text>
  <rect class="box" x="30" y="170" width="190" height="104" rx="10"/>
  <text class="t" x="46" y="196">Mobile Agent app</text>
  <text class="s" x="46" y="216">Kotlin, on your own Android</text>
  <text class="s" x="46" y="232">phone: dials out over a socket,</text>
  <text class="s" x="46" y="248">acts through accessibility</text>

  <!-- Service -->
  <rect class="big" x="260" y="30" width="400" height="470" rx="14"/>
  <text class="h" x="276" y="52">SERVICE  (one Python process, FastAPI, SQLite)</text>
  <rect class="box" x="280" y="66" width="360" height="62" rx="10"/>
  <text class="t" x="296" y="90">Orchestrator (one per bot)</text>
  <text class="s" x="296" y="110">chat, memory, routing, queues tasks, reads pictures</text>
  <rect class="box" x="280" y="140" width="360" height="52" rx="10"/>
  <text class="t" x="296" y="163">Phone worker loop</text>
  <text class="s" x="296" y="181">screenshot + UI tree -> one action, verified, crash-aware</text>
  <rect class="box" x="280" y="204" width="170" height="64" rx="10"/>
  <text class="t" x="296" y="228">Queue lanes</text>
  <text class="s" x="296" y="247">one per phone, parallel</text>
  <rect class="box" x="470" y="204" width="170" height="64" rx="10"/>
  <text class="t" x="486" y="228">Escalation chain</text>
  <text class="s" x="486" y="247">crash: move app, retry</text>
  <rect class="box" x="280" y="280" width="170" height="64" rx="10"/>
  <text class="t" x="296" y="304">Web options</text>
  <text class="s" x="296" y="323">other ways, you pick</text>
  <rect class="box" x="470" y="280" width="170" height="64" rx="10"/>
  <text class="t" x="486" y="304">Routines</text>
  <text class="s" x="486" y="323">it messages you first</text>

  <rect class="safe" x="280" y="362" width="360" height="124" rx="10"/>
  <text class="st" x="296" y="386">SAFETY</text>
  <text class="s" x="296" y="407">Approval cards before it sends, pays or installs</text>
  <text class="s" x="296" y="425">Vault: secrets typed only after you approve, never shown</text>
  <text class="s" x="296" y="443">Game guard: no automated play of games that ban bots</text>
  <text class="s" x="296" y="461">Text inside a picture or page is data, not orders</text>
  <text class="s" x="296" y="479">No sign-in tokens copied between phones</text>

  <!-- Phones -->
  <text class="h" x="720" y="34">PHONES  (all behind one adb-style interface)</text>
  <rect class="box" x="720" y="48" width="250" height="92" rx="10"/>
  <text class="t" x="736" y="72">Shared emulator</text>
  <text class="s" x="736" y="92">Android 14 arm64, Google Play,</text>
  <text class="s" x="736" y="108">Google sign-in, system apps</text>
  <text class="s" x="736" y="124">host GPU</text>
  <rect class="box" x="720" y="152" width="250" height="104" rx="10"/>
  <text class="t" x="736" y="176">Games phone</text>
  <text class="s" x="736" y="196">Redroid (Android 13) in a Lima VM,</text>
  <text class="s" x="736" y="212">APK only, software graphics,</text>
  <text class="s" x="736" y="228">boots in about 5 s, pauses in 0.2 s</text>
  <text class="s" x="736" y="244">runs apps that refuse the emulator</text>
  <rect class="box" x="720" y="268" width="250" height="92" rx="10"/>
  <text class="t" x="736" y="292">Your real phone</text>
  <text class="s" x="736" y="312">through the Mobile Agent app,</text>
  <text class="s" x="736" y="328">its own bot, only when connected</text>
  <text class="s" x="736" y="344">you see it work on the screen</text>
  <rect class="box" x="720" y="372" width="250" height="62" rx="10"/>
  <text class="t" x="736" y="396">adb phones (optional)</text>
  <text class="s" x="736" y="416">any adb endpoint (USB, cloud)</text>

  <!-- Meta -->
  <rect class="meta" x="260" y="540" width="710" height="96" rx="14"/>
  <text class="mt" x="278" y="564">META MODELS  (Meta Model API, https://api.meta.ai/v1)</text>
  <text class="t" x="278" y="590">Muse Spark 1.3</text>
  <text class="s" x="278" y="608">chat, memory, routing, web search, images</text>
  <text class="t" x="560" y="590">Muse Wonder 1.0</text>
  <text class="s" x="560" y="608">the phone worker (computer use)</text>
  <text class="t" x="790" y="590">Muse Voice Transcribe 1.0</text>
  <text class="s" x="790" y="608">the chat microphone</text>
  <text class="s" x="278" y="626">Open-weight Spark on partner inference: see OPEN_WEIGHTS_STATUS in the README</text>

  <!-- arrows -->
  <path class="ln" d="M220 100 H260" marker-end="url(#a)"/>
  <path class="ln" d="M220 222 H240 V160 H260" marker-end="url(#a)"/>
  <path class="ln" d="M660 96 H720" marker-end="url(#a)"/>
  <path class="ln" d="M660 204 H720" marker-end="url(#a)"/>
  <path class="ln" d="M660 314 H720" marker-end="url(#a)"/>
  <path class="ln" d="M660 404 H720" marker-end="url(#a)"/>
  <path class="lm" d="M460 500 V540" marker-end="url(#m)"/>
  <path class="lm" d="M560 500 V540" marker-end="url(#m)"/>
  <path class="lm" d="M780 500 V540" marker-end="url(#m)"/>
  <path class="lm" d="M780 440 V500"/>
</svg>
