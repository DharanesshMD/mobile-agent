<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Agent</title>
<style>
  :root {
    --bg: #0c0e12; --side: #10131a; --panel: #151922; --raise: #1b202b; --line: #252b38;
    --text: #e8ebf1; --dim: #8b94a6; --accent: #5b8cff; --accent-ink: #fff;
    --ok: #3ecf8e; --warn: #f5b84b; --bad: #ff6b7a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f4f8; --side: #fff; --panel: #fff; --raise: #f0f2f7; --line: #dfe3ec; --text: #161a23; --dim: #667085; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; border-color: transparent; padding: 6px 8px; }
  button.danger { color: var(--bad); }
  input, textarea, select { font: inherit; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .app { display: grid; grid-template-columns: 280px minmax(0, 1fr) 340px; height: 100vh; }
  @media (max-width: 1100px) { .app { grid-template-columns: 260px minmax(0, 1fr); } .panel { display: none; } .app.show-panel .panel { display: flex; position: fixed; right: 0; top: 0; bottom: 0; width: min(360px, 92vw); z-index: 20; box-shadow: -10px 0 40px #0008; } }
  @media (max-width: 720px) { .app { grid-template-columns: minmax(0, 1fr); } .side { display: none; } .app.show-side .side { display: flex; position: fixed; left: 0; top: 0; bottom: 0; width: min(300px, 88vw); z-index: 20; } .menu-btn { display: inline-block !important; } }

  /* sidebar */
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side header { display: flex; align-items: center; gap: 8px; padding: 14px 14px 8px; }
  .side header h1 { flex: 1; font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  .search { margin: 0 12px 8px; }
  .search input { width: 100%; }
  .bots { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .bot { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 9px 10px; border: 1px solid transparent; background: transparent; border-radius: 12px; }
  .bot:hover { background: var(--raise); }
  .bot.sel { background: var(--raise); border-color: var(--line); }
  .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; font-size: 15px; position: relative; }
  .av.sm { width: 28px; height: 28px; font-size: 12px; }
  .av.lg { width: 64px; height: 64px; font-size: 26px; }
  .bot .t { min-width: 0; flex: 1; }
  .bot .n { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bot .p { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); animation: pulse 1.2s ease-in-out infinite; flex: none; }
  .pulse.wait { background: var(--accent); }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
  .side footer { padding: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .side footer .who { flex: 1; min-width: 0; font-size: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); display: block; }
  .chip.ready i { background: var(--ok); } .chip.working i { background: var(--warn); } .chip.waiting i, .chip.control i { background: var(--accent); }

  /* chat */
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .chat header { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .chat header .name { font-weight: 650; }
  .chat header .sub { color: var(--dim); font-size: 12.5px; }
  .menu-btn { display: none !important; }
  .feed { flex: 1; overflow-y: auto; padding: 20px 18px 8px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .empty { margin: auto; text-align: center; color: var(--dim); max-width: 36ch; }
  .empty h2 { color: var(--text); font-size: 17px; margin: 10px 0 4px; }
  .msg { max-width: min(640px, 86%); padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .status { align-self: flex-start; display: flex; align-items: center; gap: 9px; color: var(--dim); font-size: 13.5px; padding: 2px 4px; max-width: 86%; }
  .status .dots { display: inline-flex; gap: 3px; } .status .dots b { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: bounce 1.1s infinite; }
  .status .dots b:nth-child(2) { animation-delay: .15s; } .status .dots b:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 40% { transform: translateY(-4px); opacity: .6; } }
  .status button { font-size: 12px; padding: 2px 8px; }
  .card { align-self: flex-start; width: min(520px, 90%); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .card.done { border-left-color: var(--ok); opacity: .8; } .card.cancelled { border-left-color: var(--dim); opacity: .6; }
  .card .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); }
  .card.done .k { color: var(--ok); } .card.cancelled .k { color: var(--dim); }
  .card .q { white-space: pre-wrap; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .card .row input { flex: 1; min-width: 120px; }
  .card .ans { color: var(--dim); font-size: 13px; }
  .composer { padding: 10px 14px 16px; }
  .composer form { display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 6px 8px; }
  .composer form:focus-within { border-color: var(--accent); }
  .composer textarea { flex: 1; resize: none; border: 0; background: transparent; padding: 8px 6px; max-height: 160px; outline: none; }
  .composer .icon { width: 34px; height: 34px; padding: 0; border-radius: 50%; display: grid; place-items: center; }

  /* right panel */
  .panel { background: var(--side); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .panel .top { padding: 22px 16px 8px; text-align: center; }
  .panel .top .nm { font-weight: 650; margin-top: 8px; }
  .tabs { display: flex; justify-content: center; gap: 4px; padding: 6px 12px 10px; }
  .tabs button { background: transparent; border-color: transparent; color: var(--dim); padding: 5px 12px; border-radius: 999px; }
  .tabs button.on { background: var(--raise); color: var(--text); border-color: var(--line); }
  .tab { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
  .thumb { position: relative; margin: 0 auto; width: 100%; max-width: 230px; aspect-ratio: 9 / 19.5; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .open { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000b; color: #fff; border-color: #fff3; backdrop-filter: blur(6px); }
  .cap { text-align: center; color: var(--dim); font-size: 12.5px; margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .lib h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
  .lib button.item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; margin-bottom: 6px; padding: 6px; }
  .lib img { width: 34px; height: 56px; object-fit: cover; border-radius: 6px; background: #000; flex: none; }
  .lib .it { min-width: 0; font-size: 13px; } .lib .it span { display: block; color: var(--dim); font-size: 12px; }
  .details p { color: var(--dim); font-size: 13.5px; } .details h4 { margin: 16px 0 4px; font-size: 13px; }
  .vault form { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 14px; }
  .vault .sec { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .vault .sec div { flex: 1; min-width: 0; } .vault .sec span { display: block; color: var(--dim); font-size: 12px; }
  .vault h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
  .hint { align-self: flex-end; max-width: min(640px, 86%); display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 12.5px; }
  .note { color: var(--dim); font-size: 13px; text-align: center; padding: 18px 8px; }

  /* full-screen mobile view */
  .overlay { position: fixed; inset: 0; background: #07080b; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; }
  .overlay.on { display: flex; }
  .overlay .close { position: absolute; right: 14px; top: 14px; }
  .overlay .screen { height: calc(100vh - 150px); aspect-ratio: 9 / 20; max-width: 94vw; border-radius: 26px; border: 2px solid var(--line); overflow: hidden; background: #000; position: relative; }
  .overlay .screen.control { border-color: var(--accent); cursor: pointer; }
  .overlay .screen img { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
  .bar { display: flex; align-items: center; gap: 8px; background: #141821; border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 14px; color: #e8ebf1; flex-wrap: wrap; justify-content: center; }
  .bar .msg-t { font-size: 14px; }
  .bar button { border-radius: 999px; background: #fff; color: #111; border-color: #fff; }
  .bar button.sm { background: #232938; color: #e8ebf1; border-color: #2d3446; padding: 5px 10px; }
  .bar input { width: 170px; background: #0d1017; color: #e8ebf1; border-color: #2d3446; border-radius: 999px; padding: 5px 12px; }
  .lightbox { position: fixed; inset: 0; background: #000d; z-index: 60; display: none; align-items: center; justify-content: center; }
  .lightbox.on { display: flex; } .lightbox img { max-height: 92vh; max-width: 92vw; border-radius: 12px; }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Bots">
    <header>
      <h1>Bots</h1>
      <button class="ghost" id="searchBtn" title="Search bots" aria-label="Search bots">&#8981;</button>
      <button class="ghost" id="newBtn" title="New bot" aria-label="New bot">+</button>
    </header>
    <div class="search" id="searchBox" hidden><input id="searchInput" type="search" placeholder="Search bots" aria-label="Search bots"></div>
    <div class="bots" id="bots"></div>
    <footer>
      <div class="av sm" style="background:#475069">O</div>
      <div class="who"><div>Owner</div><div class="chip" id="phoneChip"><i></i><span>Phone</span></div></div>
      <input id="token" type="password" placeholder="Token" style="display:none;width:90px" aria-label="Access token">
    </footer>
  </aside>

  <main class="chat">
    <header>
      <button class="ghost menu-btn" id="menuBtn" aria-label="Bots">&#9776;</button>
      <div class="av sm" id="hAv"></div>
      <div><div class="name" id="hName"></div><div class="sub" id="hSub"></div></div>
      <span style="flex:1"></span>
      <button class="ghost" id="panelBtn" title="Details and phone" aria-label="Toggle panel">&#9707;</button>
    </header>
    <div class="feed" id="feed" aria-live="polite"></div>
    <div class="composer">
      <form id="form">
        <button type="button" class="ghost icon" disabled title="Attachments come later" aria-label="Attach">+</button>
        <textarea id="text" rows="1" placeholder="Message" aria-label="Message"></textarea>
        <button type="button" class="ghost icon" disabled title="Voice comes later" aria-label="Voice">&#127908;</button>
        <button class="primary icon" id="send" aria-label="Send">&#10148;</button>
      </form>
    </div>
  </main>

  <aside class="panel" aria-label="Bot details">
    <div class="top"><div class="av lg" id="pAv" style="margin:0 auto"></div><div class="nm" id="pName"></div></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="details">Details</button>
      <button role="tab" data-tab="library">Library</button>
      <button role="tab" data-tab="vault">Vault</button>
      <button role="tab" data-tab="mobile" class="on">Mobile</button>
    </div>
    <div class="tab" id="tab"></div>
  </aside>
</div>

<div class="overlay" id="overlay">
  <button class="ghost close" id="ovClose" aria-label="Close live view">&#10005;</button>
  <div class="screen" id="ovScreen"><img id="ovImg" alt="Live view of the phone"></div>
  <div class="bar" id="ovBar"></div>
</div>
<div class="lightbox" id="lightbox"><img id="lbImg" alt="Library item"></div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };

let token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
try { token = token || sessionStorage.getItem("token") || ""; if (token) sessionStorage.setItem("token", token); } catch {}
if (location.hash) history.replaceState(null, "", location.pathname);
$("token").addEventListener("change", (e) => { token = e.target.value.trim(); try { sessionStorage.setItem("token", token); } catch {} loadBots(); });

const auth = () => token ? { Authorization: "Bearer " + token } : {};
async function api(path, body, method) {
  const r = await fetch(path, { method: method || (body === undefined ? "GET" : "POST"), headers: { "Content-Type": "application/json", ...auth() }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401) { $("token").style.display = ""; throw new Error("Access token required"); }
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(typeof e.detail === "string" ? e.detail : r.statusText); }
  return r.json();
}
const tq = () => token ? "token=" + encodeURIComponent(token) : "";

const S = { bots: [], bot: null, msgs: new Map(), es: null, tab: "mobile", mobile: { state: "ready" }, thinking: false, filter: "", control: null };

// ---------- bots ----------
const initial = (n) => (n || "?").trim().slice(0, 1).toUpperCase();
function avatar(bot, cls) { const a = el("div", "av " + (cls || ""), initial(bot.name)); a.style.background = bot.color || "#475069"; return a; }

async function loadBots() {
  try { S.bots = await api("/api/bots"); } catch (e) { return; }
  renderBots();
  if (!S.bot && S.bots.length) selectBot(S.bots[0].id);
}
function renderBots() {
  const list = $("bots"); list.replaceChildren();
  const q = S.filter.toLowerCase();
  for (const b of S.bots.filter(b => !q || b.name.toLowerCase().includes(q))) {
    const btn = el("button", "bot" + (S.bot && S.bot.id === b.id ? " sel" : ""));
    btn.append(avatar(b));
    const t = el("div", "t"); t.append(el("div", "n", b.name), el("div", "p", b.last || "No messages yet")); btn.append(t);
    if (b.active) btn.append(el("span", "pulse" + (b.active === "waiting" ? " wait" : "")));
    btn.onclick = () => { selectBot(b.id); $("app").classList.remove("show-side"); };
    list.append(btn);
  }
}
$("searchBtn").onclick = () => { const b = $("searchBox"); b.hidden = !b.hidden; if (!b.hidden) $("searchInput").focus(); };
$("searchInput").oninput = (e) => { S.filter = e.target.value; renderBots(); };
$("newBtn").onclick = async () => {
  const name = prompt("Name for the new bot");
  if (!name || !name.trim()) return;
  const persona = prompt("What should it focus on? (optional)") || "";
  try { const b = await api("/api/bots", { name: name.trim(), persona }); await loadBots(); selectBot(b.id); } catch (e) { alert(e.message); }
};
$("menuBtn").onclick = () => $("app").classList.toggle("show-side");
$("panelBtn").onclick = () => $("app").classList.toggle("show-panel");

async function selectBot(id) {
  if (S.es) S.es.close();
  const st = await api(`/api/bots/${id}/state`);
  S.bot = st.bot; S.msgs = new Map(st.messages.map(m => [m.id, m])); S.thinking = false; S.mobile = st.mobile;
  renderBots(); renderHeader(); renderFeed(true); renderTab();
  S.es = new EventSource(`/api/bots/${id}/events?after=${st.last_seq}` + (token ? "&" + tq() : ""));
  S.es.onmessage = (e) => onEvent(JSON.parse(e.data));
}
function onEvent(ev) {
  if (ev.type === "message") {
    const m = ev.message;
    if (m.role === "assistant" && m.kind !== "status") S.thinking = false;
    S.msgs.set(m.id, m); renderFeed(); if (m.kind === "text" || m.kind === "result") loadBotsSoon();
    if (m.kind === "action_item" && m.meta.status === "open") pollMobile();
  } else if (ev.type === "message_delete") { S.msgs.delete(ev.id); renderFeed(); }
  if (S.tab === "library") renderTab();
}
let botsTimer; function loadBotsSoon() { clearTimeout(botsTimer); botsTimer = setTimeout(loadBots, 400); }

// ---------- header / feed ----------
function renderHeader() {
  const b = S.bot; if (!b) return;
  $("hAv").replaceWith(Object.assign(avatar(b, "sm"), { id: "hAv" }));
  $("pAv").replaceWith(Object.assign(avatar(b, "lg"), { id: "pAv", style: "margin:0 auto;background:" + b.color }));
  $("hName").textContent = $("pName").textContent = b.name;
  $("hSub").textContent = "Muse Spark 1.3 · phone worker Muse Wonder";
}
function renderFeed(jump) {
  const feed = $("feed"), nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140;
  feed.replaceChildren();
  const list = [...S.msgs.values()].sort((a, b) => a.id - b.id);
  if (!list.length) {
    const e = el("div", "empty"); e.append(avatar(S.bot, "lg"), el("h2", "", S.bot ? S.bot.name : ""), el("div", "", "Ask for something. If it needs the phone, I'll do it in the background and show it on the right."));
    e.firstChild.style.margin = "0 auto"; feed.append(e);
  }
  for (const m of list) {
    if (m.kind === "status") feed.append(statusLine(m));
    else if (m.kind === "action_item") feed.append(card(m));
    else {
      feed.append(el("div", "msg " + m.role, m.content));
      if (m.meta && m.meta.sensitive) {
        const h = el("div", "hint", "Hidden before sending: " + m.meta.sensitive.join(", ") + ".");
        const b = el("button", "ghost", "Save it to the vault"); b.onclick = () => document.querySelector('.tabs button[data-tab="vault"]').click(); h.append(b); feed.append(h);
      }
    }
  }
  if (S.thinking && !list.some(m => m.kind === "status")) { const s = el("div", "status"); s.append(dots(), el("span", "", "Thinking")); feed.append(s); }
  if (jump || nearBottom) feed.scrollTop = feed.scrollHeight;
}
function dots() { const d = el("span", "dots"); d.append(el("b"), el("b"), el("b")); return d; }
function statusLine(m) {
  const s = el("div", "status"); s.append(dots(), el("span", "", m.content));
  const stop = el("button", "ghost", "Stop"); stop.onclick = () => api(`/api/jobs/${m.meta.job_id}/cancel`, {}).catch(e => alert(e.message));
  s.append(stop); return s;
}

// ---------- action cards ----------
const KIND = { confirm: "Needs your approval", choice: "Your choice", text: "Quick question", handoff: "Your turn on the phone", otp: "One-time code" };
function card(m) {
  const meta = m.meta, open = meta.status === "open";
  const c = el("div", "card" + (meta.status === "answered" ? " done" : meta.status === "cancelled" ? " cancelled" : ""));
  c.append(el("div", "k", open ? KIND[meta.kind] || "Action needed" : meta.status === "answered" ? "Answered" : "No longer needed"), el("div", "q", m.content));
  if (!open) { if (meta.status === "answered" && meta.answer) c.append(el("div", "ans", meta.answer)); return c; }
  const send = (body) => api(`/api/items/${meta.item_id}/answer`, body).catch(e => alert(e.message));
  const row = el("div", "row");
  if (meta.kind === "confirm") {
    const y = el("button", "primary", "Approve"), n = el("button", "danger", "Decline"); y.onclick = () => send({ approved: true }); n.onclick = () => send({ approved: false }); row.append(y, n);
  } else if (meta.kind === "choice") {
    for (const o of meta.options) { const b = el("button", "", o); b.onclick = () => send({ choice: o }); row.append(b); }
  } else if (meta.kind === "text") {
    const i = el("input"); i.placeholder = "Your answer"; i.setAttribute("aria-label", "Your answer"); const b = el("button", "primary", "Send");
    const go = () => i.value.trim() && send({ value: i.value.trim() }); b.onclick = go; i.onkeydown = (e) => e.key === "Enter" && go(); row.append(i, b);
  } else if (meta.kind === "handoff") {
    c.append(el("div", "ans", "Use the live phone view. Type passwords yourself; the agent never sees them."));
    const b = el("button", "primary", "Take control"); b.onclick = () => openOverlay({ control: true, handoff: meta.item_id }); row.append(b);
  } else {
    const i = el("input"); i.inputMode = "numeric"; i.maxLength = 8; i.placeholder = "Code"; i.autocomplete = "one-time-code"; i.setAttribute("aria-label", "One-time code");
    const b = el("button", "primary", "Send code"), d = el("button", "danger", "Decline");
    const go = () => /^\d{4,8}$/.test(i.value.trim()) ? send({ code: i.value.trim() }) : alert("Enter the 4 to 8 digit code");
    b.onclick = go; d.onclick = () => send({ approved: false }); i.onkeydown = (e) => e.key === "Enter" && go(); row.append(i, b, d);
  }
  c.append(row); return c;
}

// ---------- composer ----------
const ta = $("text");
ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 160) + "px"; });
ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = ta.value.trim(); if (!text || !S.bot) return;
  ta.value = ""; ta.style.height = "auto"; S.thinking = true;
  try { const m = await api(`/api/bots/${S.bot.id}/messages`, { text }); S.msgs.set(m.id, m); renderFeed(true); }
  catch (err) { S.thinking = false; alert(err.message); ta.value = text; }
});

// ---------- right panel ----------
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b)); renderTab(); });
const STATE_TEXT = { ready: "Ready", working: "Working", waiting: "Waiting for you", control: "You're in control" };
async function renderTab() {
  const t = $("tab"); if (!S.bot) return;
  if (S.tab === "mobile") {
    t.replaceChildren();
    const th = el("div", "thumb"), img = el("img"); img.id = "thumbImg"; img.alt = "Live view of the phone"; th.append(img);
    const open = el("button", "open", "Open"); open.onclick = () => openOverlay({}); th.append(open);
    const cap = el("div", "cap"); cap.append(el("div", "", S.bot.name + "'s phone"));
    const chip = el("div", "chip " + S.mobile.state); chip.id = "stateChip"; chip.append(el("i"), el("span", "", STATE_TEXT[S.mobile.state] || S.mobile.state)); cap.append(chip);
    t.append(th, cap); refreshShot();
  } else if (S.tab === "vault") {
    t.replaceChildren(); const v = el("div", "vault");
    v.append(el("div", "note", "Secrets are encrypted. The agent types one only after you approve each use, and never sees the value."));
    const f = el("form"), label = el("input"), kind = el("select"), val = el("input"), add = el("button", "primary", "Save to vault");
    label.placeholder = "Label, e.g. netflix password"; label.maxLength = 60; label.setAttribute("aria-label", "Label");
    for (const k of ["password", "card", "id", "note"]) kind.append(new Option(k, k)); kind.setAttribute("aria-label", "Kind");
    val.type = "password"; val.placeholder = "Secret value"; val.autocomplete = "off"; val.setAttribute("aria-label", "Secret value");
    f.onsubmit = async (e) => {
      e.preventDefault(); if (!label.value.trim() || !val.value) return;
      try { await api("/api/vault", { label: label.value.trim(), value: val.value, kind: kind.value, bot_id: S.bot.id }); renderTab(); }
      catch (err) { alert(err.message); } finally { val.value = ""; }
    };
    f.append(label, kind, val, add); v.append(f);
    let secrets = [], audit = [];
    try { [secrets, audit] = await Promise.all([api("/api/vault"), api("/api/vault/audit")]); } catch {}
    v.append(el("h4", "", "Saved secrets"));
    if (!secrets.length) v.append(el("div", "note", "Nothing saved yet."));
    for (const s of secrets) {
      const r = el("div", "sec"), d = el("div", "", s.label); d.append(el("span", "", s.kind)); const x = el("button", "danger", "Delete");
      x.onclick = async () => { if (confirm(`Delete "${s.label}"?`)) { try { await api(`/api/vault/${s.id}`, undefined, "DELETE"); } catch (err) { alert(err.message); } renderTab(); } };
      r.append(d, x); v.append(r);
    }
    if (audit.length) {
      v.append(el("h4", "", "Recent use"));
      for (const a of audit.slice(0, 8)) { const r = el("div", "sec"), d = el("div", "", a.label + (a.app ? " in " + a.app : "")); d.append(el("span", "", new Date(a.at * 1000).toLocaleString())); r.append(d); v.append(r); }
    }
    t.append(v);
  } else if (S.tab === "library") {
    t.replaceChildren(); let items = [];
    try { items = await api(`/api/bots/${S.bot.id}/library`); } catch {}
    if (!items.length) { t.append(el("div", "note", "Screenshots from finished tasks will show up here.")); return; }
    const lib = el("div", "lib"), week = Date.now() / 1000 - 7 * 86400;
    for (const [label, rows] of [["This week", items.filter(i => i.created >= week)], ["Older", items.filter(i => i.created < week)]]) {
      if (!rows.length) continue; lib.append(el("h4", "", label));
      for (const i of rows) {
        const b = el("button", "item"), img = el("img"); img.src = `/api/library/${i.id}/file` + (token ? "?" + tq() : ""); img.alt = "";
        const tx = el("div", "it", i.title); tx.append(el("span", "", new Date(i.created * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })));
        b.append(img, tx); b.onclick = () => { $("lbImg").src = img.src; $("lightbox").classList.add("on"); }; lib.append(b);
      }
    }
    t.append(lib);
  } else {
    t.replaceChildren(); const d = el("div", "details");
    d.append(el("h4", "", "About"), el("p", "", S.bot.persona || "A general assistant. Ask it anything; it uses the cloud phone when a task needs one."),
      el("h4", "", "Models"), el("p", "", "Chat and planning: Muse Spark 1.3. Phone control (screen, taps, typing): Muse Wonder."),
      el("h4", "", "Routines"), el("p", "", "Routines are recurring tasks a bot runs on a schedule. Scheduling is not built yet."));
    t.append(d);
  }
}
$("lightbox").onclick = () => $("lightbox").classList.remove("on");

// ---------- mobile state and live frames ----------
async function pollMobile() {
  try { S.mobile = await api("/api/mobile/state"); } catch { return; }
  const chip = $("stateChip"); if (chip) { chip.className = "chip " + S.mobile.state; chip.lastChild.textContent = STATE_TEXT[S.mobile.state] || S.mobile.state; }
  $("phoneChip").className = "chip " + S.mobile.state; $("phoneChip").lastChild.textContent = "Phone: " + (STATE_TEXT[S.mobile.state] || "").toLowerCase();
  if ($("overlay").classList.contains("on")) renderBar();
}
let shotBusy = false;
async function refreshShot() {
  const ov = $("overlay").classList.contains("on"); const img = ov ? $("ovImg") : $("thumbImg");
  if (!img || shotBusy) return; shotBusy = true;
  try {
    const r = await fetch("/api/device/screenshot?t=" + Date.now(), { headers: auth() });
    if (r.ok) { const u = URL.createObjectURL(await r.blob()), old = img.src; img.src = u; if (old.startsWith("blob:")) URL.revokeObjectURL(old); }
  } catch {}
  shotBusy = false;
}
setInterval(pollMobile, 2000);
(function frames() { if (S.tab === "mobile" || $("overlay").classList.contains("on")) refreshShot(); setTimeout(frames, $("overlay").classList.contains("on") ? 1000 : 2500); })();

// ---------- full-screen mobile view ----------
function openOverlay(opts) {
  S.control = { held: false, handoff: opts.handoff || null };
  $("overlay").classList.add("on"); refreshShot();
  if (opts.control) takeControl(); else renderBar();
}
async function takeControl() { try { await api("/api/mobile/control", { action: "take" }); S.control.held = true; } catch (e) { alert(e.message); } pollMobile(); renderBar(); }
async function releaseControl(done) {
  try { await api("/api/mobile/control", { action: "release" }); } catch {}
  S.control.held = false;
  if (done && S.control.handoff) await api(`/api/items/${S.control.handoff}/answer`, { done: true }).catch(() => {});
  S.control.handoff = null; pollMobile(); renderBar();
}
function closeOverlay() { if (S.control && S.control.held) releaseControl(false); $("overlay").classList.remove("on"); }
$("ovClose").onclick = closeOverlay;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeOverlay(); $("lightbox").classList.remove("on"); } });

function renderBar() {
  const bar = $("ovBar"), held = S.control && S.control.held; bar.replaceChildren();
  $("ovScreen").classList.toggle("control", !!held);
  if (held) {
    bar.append(el("span", "msg-t", "You're in control"));
    for (const [k, label] of [["back", "◀"], ["home", "●"], ["recents", "■"]]) { const b = el("button", "sm", label); b.title = k; b.onclick = () => api("/api/device/key", { key: k }).then(refreshShot).catch(() => {}); bar.append(b); }
    for (const [d, label] of [["up", "↑"], ["down", "↓"]]) { const b = el("button", "sm", label); b.title = "scroll " + d; b.onclick = () => api("/api/device/swipe", { direction: d }).then(refreshShot).catch(() => {}); bar.append(b); }
    const i = el("input"); i.placeholder = "Type on the phone"; i.setAttribute("aria-label", "Type on the phone");
    i.onkeydown = (e) => { if (e.key === "Enter" && i.value) { api("/api/device/type", { text: i.value }).then(() => { i.value = ""; refreshShot(); }).catch(err => alert(err.message)); } };
    const done = el("button", "", "I'm done"); done.onclick = () => releaseControl(true);
    bar.append(i, done);
  } else {
    const st = S.mobile.state;
    bar.append(el("span", "msg-t", st === "working" ? "Watching live: the agent is working" : "Watching live"));
    const b = el("button", "", "Take control"); b.onclick = takeControl; bar.append(b);
  }
}
$("ovScreen").addEventListener("click", (e) => {
  if (!(S.control && S.control.held)) return;
  const img = $("ovImg"), r = img.getBoundingClientRect(), ar = img.naturalWidth / img.naturalHeight || 0.45;
  let w = r.width, h = r.height, ox = 0, oy = 0;
  if (w / h > ar) { w = h * ar; ox = (r.width - w) / 2; } else { h = w / ar; oy = (r.height - h) / 2; }
  const fx = (e.clientX - r.left - ox) / w, fy = (e.clientY - r.top - oy) / h;
  if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return;
  api("/api/device/tap", { fx, fy }).then(refreshShot).catch((err) => alert(err.message));
});

loadBots(); pollMobile();
</script>
</body>
</html>
