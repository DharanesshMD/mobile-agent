<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Agent</title>
<style>
  :root {
    --bg: #0c0e12; --side: #10131a; --panel: #151922; --raise: #1b202b; --line: #252b38;
    --text: #e8ebf1; --dim: #8b94a6; --accent: #5b8cff; --accent-ink: #fff;
    --ok: #3ecf8e; --warn: #f5b84b; --bad: #ff6b7a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f4f8; --side: #fff; --panel: #fff; --raise: #f0f2f7; --line: #dfe3ec; --text: #161a23; --dim: #667085; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; border-color: transparent; padding: 6px 8px; }
  button.danger { color: var(--bad); }
  input, textarea, select { font: inherit; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .app { display: grid; grid-template-columns: 280px minmax(0, 1fr) 340px; height: 100vh; }
  @media (max-width: 1100px) { .app { grid-template-columns: 260px minmax(0, 1fr); } .panel { display: none; } .app.show-panel .panel { display: flex; position: fixed; right: 0; top: 0; bottom: 0; width: min(360px, 92vw); z-index: 20; box-shadow: -10px 0 40px #0008; } }
  @media (max-width: 720px) { .app { grid-template-columns: minmax(0, 1fr); } .side { display: none; } .app.show-side .side { display: flex; position: fixed; left: 0; top: 0; bottom: 0; width: min(300px, 88vw); z-index: 20; } .menu-btn { display: inline-block !important; } }

  /* sidebar */
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side header { display: flex; align-items: center; gap: 8px; padding: 14px 14px 8px; }
  .side header h1 { flex: 1; font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  .search { margin: 0 12px 8px; }
  .search input { width: 100%; }
  .bots { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .bot { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 9px 10px; border: 1px solid transparent; background: transparent; border-radius: 12px; }
  .bot:hover { background: var(--raise); }
  .bot.sel { background: var(--raise); border-color: var(--line); }
  .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; font-size: 15px; position: relative; }
  .av.sm { width: 28px; height: 28px; font-size: 12px; }
  .av.lg { width: 64px; height: 64px; font-size: 26px; }
  .bot .t { min-width: 0; flex: 1; }
  .bot .n { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bot .p { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .botrow { position: relative; }
  .botrow .bot { padding-right: 42px; }
  .botrow .more { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; padding: 0; border: 0; border-radius: 8px; display: grid; place-items: center; color: var(--dim); background: transparent; opacity: 0; transition: opacity .12s, background .12s; }
  .botrow .more svg { width: 16px; height: 16px; fill: currentColor; }
  .botrow:hover .more, .botrow .more.open, .botrow .more:focus-visible { opacity: 1; }
  .botrow .more:hover:not(:disabled), .botrow .more.open { background: #ffffff14; color: var(--text); border-color: transparent; }
  .botrow .more:focus:not(:focus-visible) { outline: none; }
  .botrow:hover .pulse { visibility: hidden; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #2a1519; color: #ffb3bc; border: 1px solid #5a2a31; padding: 10px 16px; border-radius: 12px; z-index: 100; font-size: 13.5px; max-width: 90vw; box-shadow: 0 10px 30px #0008; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; width: min(440px, 92vw); box-shadow: 0 24px 60px #000a; }
  dialog::backdrop { background: #000a; }
  dialog h3 { margin: 0 0 6px; font-size: 17px; } dialog .sub { color: var(--dim); font-size: 13.5px; margin-bottom: 12px; }
  dialog .sect { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 14px 0 4px; }
  dialog ul { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.6; } dialog li.keep { list-style: "\2713  "; color: var(--ok); } dialog li.keep span { color: var(--text); }
  dialog label.opt { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; cursor: pointer; }
  dialog .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  dialog button.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
  .menu { position: absolute; right: 8px; top: calc(50% + 18px); z-index: 20; min-width: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 5px; display: flex; flex-direction: column; gap: 1px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .menu button { background: transparent; border: 0; text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; display: flex; align-items: center; gap: 9px; }
  .menu button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .menu button:hover { background: var(--raise); border-color: transparent; }
  .menu button.danger:hover { background: #ff5d6c1f; }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); animation: pulse 1.2s ease-in-out infinite; flex: none; }
  .pulse.wait { background: var(--accent); }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
  .side footer { padding: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .side footer .who { flex: 1; min-width: 0; font-size: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); display: block; }
  .chip.sleeping i { background: #6b7385; } .chip.off i { background: var(--bad); } .chip.waking i { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .phonecard { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 28px 18px; border: 1px dashed var(--line); border-radius: 22px; background: var(--panel); min-height: 260px; }
  .phonecard svg { width: 34px; height: 34px; fill: none; stroke: var(--dim); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .phonecard .ttl { font-weight: 650; } .phonecard .sub { color: var(--dim); font-size: 13px; max-width: 260px; } .phonecard .err { color: var(--bad); font-size: 13px; max-width: 260px; }
  .phonecard .prog { width: 180px; height: 4px; border-radius: 4px; background: var(--raise); overflow: hidden; }
  .phonecard .prog b { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .8s linear; }
  .phonecard .prog.ind b { width: 35%; animation: slide 1.4s ease-in-out infinite; } @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  .sleepnote { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 6px; } .sleepnote button { padding: 2px 8px; font-size: 12px; }
  .overlay .screen .asleep { position: absolute; inset: 0; background: #07080b; display: none; align-items: center; justify-content: center; }
  .overlay .screen.off .asleep { display: flex; } .overlay .screen.off img { visibility: hidden; }
  .chip.ready i { background: var(--ok); } .chip.working i { background: var(--warn); } .chip.waiting i, .chip.control i { background: var(--accent); }

  /* chat */
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .chat header { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .chat header .name { font-weight: 650; }
  .chat header .sub { color: var(--dim); font-size: 12.5px; }
  .menu-btn { display: none !important; }
  /* A landscape app (a game, a video): give the phone the room. The bot list becomes a drawer and the phone panel widens. */
  .app.landscape { grid-template-columns: minmax(0, 1fr) min(600px, 52vw); }
  @media (max-width: 1100px) { .app.landscape { grid-template-columns: minmax(0, 1fr); } }
  .app.landscape .side { display: none; }
  .app.landscape.show-side .side { display: flex; position: fixed; left: 0; top: 0; bottom: 0; width: min(300px, 88vw); z-index: 20; box-shadow: 10px 0 40px #0008; }
  .app.landscape .menu-btn { display: inline-block !important; }
  /* When the bot list is a drawer (landscape phone view, narrow windows) it can be closed: the dimmed backdrop, the X, Esc, or picking a bot. */
  .scrim, .drawer-close { display: none; }
  .app.landscape.show-side .scrim { display: block; position: fixed; inset: 0; background: #0009; z-index: 15; }
  .app.landscape.show-side .drawer-close { display: inline-block; }
  @media (max-width: 720px) { .app.show-side .scrim { display: block; position: fixed; inset: 0; background: #0009; z-index: 15; } .app.show-side .drawer-close { display: inline-block; } }
  .thumb.landscape { max-width: 100%; aspect-ratio: 20 / 9; }
  .overlay .screen.landscape { aspect-ratio: 20 / 9; height: auto; width: min(94vw, calc((100vh - 150px) * 20 / 9)); }
  .feed { flex: 1; overflow-y: auto; padding: 20px 18px 8px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .empty { margin: auto; text-align: center; color: var(--dim); max-width: 36ch; }
  .empty h2 { color: var(--text); font-size: 17px; margin: 10px 0 4px; }
  .msg { max-width: min(640px, 86%); padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .status { align-self: flex-start; display: flex; align-items: center; gap: 9px; color: var(--dim); font-size: 13.5px; padding: 2px 4px; max-width: 86%; }
  .status .dots { display: inline-flex; gap: 3px; } .status .dots b { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: bounce 1.1s infinite; }
  .status .dots b:nth-child(2) { animation-delay: .15s; } .status .dots b:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 40% { transform: translateY(-4px); opacity: .6; } }
  .status button { font-size: 12px; padding: 2px 8px; }
  .card { align-self: flex-start; width: min(520px, 90%); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .card.done { border-left-color: var(--ok); opacity: .8; } .card.cancelled { border-left-color: var(--dim); opacity: .6; }
  .card .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); }
  .card.done .k { color: var(--ok); } .card.cancelled .k { color: var(--dim); }
  .card .q { white-space: pre-wrap; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .card .row input { flex: 1; min-width: 120px; }
  .card .ans { color: var(--dim); font-size: 13px; }
  .composer { padding: 10px 14px 16px; }
  .composer form { display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 6px 8px; }
  .composer form:focus-within { border-color: var(--accent); }
  .composer textarea { flex: 1; resize: none; border: 0; background: transparent; padding: 8px 6px; max-height: 160px; outline: none; }
  .mic svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
  .mic .t { display: none; }
  .composer .icon.mic.rec { width: auto; min-width: 34px; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 7px; flex: none; border-radius: 999px; background: #ff5d6c22; color: var(--bad); border: 1px solid #ff5d6c66; animation: rec 1.3s ease-in-out infinite; }
  .composer .icon.mic.rec .t { display: inline; font-size: 12.5px; font-weight: 600; line-height: 1; min-width: 2.4em; text-align: left; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .composer .icon.mic.rec svg { flex: none; }
  .mic.busy { opacity: .7; } .mic.busy svg { animation: spin 1s linear infinite; }
  @keyframes rec { 50% { box-shadow: 0 0 0 5px #ff5d6c1c; } } @keyframes spin { to { transform: rotate(360deg); } }
  .composer .icon { width: 34px; height: 34px; padding: 0; border-radius: 50%; display: grid; place-items: center; }

  /* right panel */
  .panel { background: var(--side); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .panel .top { padding: 22px 16px 8px; text-align: center; }
  .panel .top .nm { font-weight: 650; margin-top: 8px; }
  .tabs { display: flex; justify-content: center; gap: 4px; padding: 6px 12px 10px; }
  .tabs button { background: transparent; border-color: transparent; color: var(--dim); padding: 5px 12px; border-radius: 999px; }
  .tabs button.on { background: var(--raise); color: var(--text); border-color: var(--line); }
  .tab { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
  .thumb { position: relative; margin: 0 auto; width: 100%; max-width: 230px; aspect-ratio: 9 / 19.5; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .open { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000b; color: #fff; border-color: #fff3; backdrop-filter: blur(6px); }
  .cap { text-align: center; color: var(--dim); font-size: 12.5px; margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .lib h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
  .lib button.item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; margin-bottom: 6px; padding: 6px; }
  .lib img { width: 34px; height: 56px; object-fit: cover; border-radius: 6px; background: #000; flex: none; }
  .lib .it { min-width: 0; font-size: 13px; } .lib .it span { display: block; color: var(--dim); font-size: 12px; }
  .details p { color: var(--dim); font-size: 13.5px; } .details h4 { margin: 16px 0 4px; font-size: 13px; }
  .vault form { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 14px; }
  .vault .sec { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .vault .sec div { flex: 1; min-width: 0; } .vault .sec span { display: block; color: var(--dim); font-size: 12px; }
  .vault h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
  .botrow .tag { position: absolute; right: 44px; top: 9px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: #a89bff; pointer-events: none; }
  .botrow.master .bot { border-color: #3a3560; background: #1a1830; }
  .unread { min-width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
  .alertcard { align-self: flex-start; max-width: min(560px, 90%); display: flex; gap: 10px; align-items: flex-start; background: #221c14; border: 1px solid #4a3a1c; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .alertcard b { color: var(--warn); } .alertcard button { margin-top: 6px; }
  .msg a { color: inherit; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
  .botnote { align-self: center; max-width: min(560px, 90%); white-space: pre-wrap; font-size: 12.5px; color: var(--dim); border: 1px dashed var(--line); border-radius: 12px; padding: 8px 12px; }
  .hint { align-self: flex-end; max-width: min(640px, 86%); display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 12.5px; }
  .note { color: var(--dim); font-size: 13px; text-align: center; padding: 18px 8px; }

  /* full-screen mobile view */
  .overlay { position: fixed; inset: 0; background: #07080b; z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; }
  .overlay.on { display: flex; }
  .overlay .close { position: absolute; right: 14px; top: 14px; }
  .overlay .screen { height: calc(100vh - 140px); aspect-ratio: 9 / 20; max-width: 94vw; border-radius: 26px; border: 2px solid var(--line); overflow: hidden; background: #000; position: relative; }
  .overlay .screen.control { border-color: var(--accent); cursor: crosshair; touch-action: none; user-select: none; outline: none; }
  .tap.long { background: #f5b84b66; border-color: var(--warn); }
  .tap { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: #ffffff55; border: 2px solid #fff; pointer-events: none; animation: tap .45s ease-out forwards; }
  @keyframes tap { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .overlay .screen img { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
  .dock { display: flex; align-items: center; gap: 10px; background: #141821; border: 1px solid #232938; border-radius: 18px; padding: 8px 10px; width: min(780px, 94vw); flex-wrap: wrap; color: #e8ebf1; box-shadow: 0 10px 30px #0006; }
  .dock .status { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; white-space: nowrap; padding: 0 4px; }
  .dock .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dock .status.live i { background: var(--accent); box-shadow: 0 0 0 0 #6b8cff88; animation: ring 1.6s ease-out infinite; }
  .dock .status.busy i { background: var(--warn); }
  @keyframes ring { to { box-shadow: 0 0 0 7px #6b8cff00; } }
  .dock .grp { display: flex; gap: 2px; background: #0d1017; border-radius: 12px; padding: 3px; }
  .dock .ib { width: 34px; height: 32px; padding: 0; border: 0; border-radius: 9px; background: transparent; color: #cfd5e2; display: grid; place-items: center; }
  .dock .ib:hover:not(:disabled) { background: #232938; color: #fff; border-color: transparent; }
  .dock .ib svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dock input { flex: 1; min-width: 150px; background: #0d1017; color: #e8ebf1; border: 1px solid #232938; border-radius: 12px; padding: 7px 12px; }
  .dock input:focus { border-color: var(--accent); outline: none; }
  .dock .go { border-radius: 12px; padding: 7px 16px; font-weight: 600; margin-left: auto; }
  .dock .go.stop { background: #fff; color: #111; border-color: #fff; }
  .dock-hint { color: #8b93a7; font-size: 12px; text-align: center; max-width: 94vw; }
  @media (max-width: 760px) { .dock-hint { display: none; } }
  .lightbox { position: fixed; inset: 0; background: #000d; z-index: 60; display: none; align-items: center; justify-content: center; }
  .lightbox.on { display: flex; } .lightbox img { max-height: 92vh; max-width: 92vw; border-radius: 12px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <aside class="side" aria-label="Bots">
    <header>
      <h1>Bots</h1>
      <button class="ghost" id="searchBtn" title="Search bots" aria-label="Search bots">&#8981;</button>
      <button class="ghost" id="newBtn" title="New bot" aria-label="New bot">+</button>
      <button class="ghost drawer-close" id="sideClose" title="Close" aria-label="Close the bot list">&#10005;</button>
    </header>
    <div class="search" id="searchBox" hidden><input id="searchInput" type="search" placeholder="Search bots" aria-label="Search bots"></div>
    <div class="bots" id="bots"></div>
    <footer>
      <div class="av sm" style="background:#475069">O</div>
      <div class="who"><div>Owner</div><div class="chip" id="phoneChip"><i></i><span>Phone</span></div></div>
      <input id="token" type="password" placeholder="Token" style="display:none;width:90px" aria-label="Access token">
    </footer>
  </aside>

  <main class="chat">
    <header>
      <button class="ghost menu-btn" id="menuBtn" aria-label="Bots">&#9776;</button>
      <div class="av sm" id="hAv"></div>
      <div><div class="name" id="hName"></div><div class="sub" id="hSub"></div></div>
      <span style="flex:1"></span>
      <button class="ghost" id="panelBtn" title="Details and phone" aria-label="Toggle panel">&#9707;</button>
    </header>
    <div class="feed" id="feed" aria-live="polite"></div>
    <div class="composer">
      <form id="form">
        <button type="button" class="ghost icon" disabled title="Attachments come later" aria-label="Attach">+</button>
        <textarea id="text" rows="1" placeholder="Message" aria-label="Message"></textarea>

<script>
const $ = (id) => document.getElementById(id);

let token = new URLSearchParams(location.hash.slice(1)).get("token") || "";

if (location.hash) history.replaceState(null, "", location.pathname);
$("token").addEventListener("change", (e) => { token = e.target.value.trim(); try { sessionStorage.setItem("token", token); } catch {} loadBots(); });

const auth = () => token ? { Authorization: "Bearer " + token } : {};
async function api(path, body, method) {

}

// Native alert/confirm/prompt are blocked in some embedded browsers, so errors and confirmations use these.

    const done = (v) => { dlg.close(); dlg.remove(); resolve(v); };

}
const S = { bots: [], bot: null, msgs: new Map(), es: null, tab: "details", mobile: { state: "ready" }, thinking: false, filter: "", control: null };

// ---------- bots ----------
const initial = (n) => (n || "?").trim().slice(0, 1).toUpperCase();
function avatar(bot, cls) { const a = el("div", "av " + (cls || ""), bot.kind === "master" ? "\u2726" : initial(bot.name)); a.style.background = bot.color || "#475069"; return a; }

// Unread badges and notifications: remember the last message the owner has seen in each bot (per browser).
try { S.seen = JSON.parse(localStorage.getItem("seen") || "{}"); } catch { S.seen = {}; }
S.notified = {};
const saveSeen = () => { try { localStorage.setItem("seen", JSON.stringify(S.seen)); } catch {} };
function markSeen(bot, lastId) { if (!bot || lastId === undefined || (S.seen[bot] || 0) >= lastId) return; S.seen[bot] = lastId; saveSeen(); }
document.addEventListener("click", () => { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {}); }, { once: true });
async function loadBots() {
  try { S.bots = await api("/api/bots"); } catch (e) { return; }
  let unread = 0;
  for (const b of S.bots) {
    if (S.seen[b.id] === undefined) S.seen[b.id] = b.last_id;      // first visit: nothing is "new"
    if (S.bot && S.bot.id === b.id) S.seen[b.id] = Math.max(S.seen[b.id], b.last_id);
    b.unread = b.last_id > S.seen[b.id]; if (b.unread) unread++;

    else if (b.unread && b.last_id > S.notified[b.id]) {

      if (b.kind === "master" && "Notification" in window && Notification.permission === "granted") { try { new Notification("Master bot", { body: b.last, tag: "master" }); } catch {} }
    }

}
function renderBots() {

  for (const b of S.bots.filter(b => !q || b.name.toLowerCase().includes(q))) {
    const btn = el("button", "bot" + (S.bot && S.bot.id === b.id ? " sel" : ""));
    btn.append(avatar(b));
    const t = el("div", "t"); t.append(el("div", "n", b.name), el("div", "p", b.last || "No messages yet")); btn.append(t);
    if (b.active) btn.append(el("span", "pulse" + (b.active === "waiting" ? " wait" : "")));
    btn.onclick = () => { selectBot(b.id); $("app").classList.remove("show-side"); };
    const row = el("div", "botrow" + (b.kind === "master" ? " master" : "")), more = el("button", "more");
    if (b.kind === "master") row.append(el("span", "tag", "Master"));
    if (b.unread && !(S.bot && S.bot.id === b.id)) btn.append(el("span", "unread"));
    more.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>';
    more.setAttribute("aria-label", "Bot options");
    more.onclick = (e) => { e.stopPropagation(); openMenu(row, more, b); };
    row.append(btn, more); list.append(row);
  }
}
function closeMenu() { document.querySelectorAll(".menu").forEach(m => m.remove()); document.querySelectorAll(".more.open").forEach(m => m.classList.remove("open")); }
document.addEventListener("click", closeMenu);
const closeSide = () => $("app").classList.remove("show-side");
$("scrim").onclick = $("sideClose").onclick = closeSide;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMenu(); closeSide(); } });
function openMenu(row, more, bot) {
  const was = more.classList.contains("open"); closeMenu(); if (was) return;
  more.classList.add("open");
  const m = el("div", "menu"), ren = el("button"), del = el("button", "danger");
  ren.innerHTML = '<svg viewBox="0 0 16 16"><path d="M2.5 13.5l.7-3L11 2.7a1.4 1.4 0 012 2L5.5 12.8z"/></svg>Rename';
  del.innerHTML = '<svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>Delete';
  m.setAttribute("role", "menu"); ren.onclick = () => renameBot(bot); del.onclick = () => deleteBot(bot);
  m.append(ren); if (bot.kind !== "master") m.append(del); row.append(m);
}
async function renameBot(bot) {
  const v = await botForm("Rename bot", bot.name, bot.persona, "Save"); if (!v) return;
  try {
    const nb = await api(`/api/bots/${bot.id}`, v, "PATCH");
    if (S.bot && S.bot.id === bot.id) { S.bot = nb; renderHeader(); renderTab(); }
    await loadBots();
  } catch (e) { toast(e.message); }
}
function askDelete(bot, info) {
  return new Promise((resolve) => {
    const dlg = el("dialog"), n = (k, one, many) => info[k] ? `${info[k]} ${info[k] === 1 ? one : many}` : null;
    dlg.append(el("h3", "", `Delete "${bot.name}"?`), el("div", "sub", info.last ? "This is your only bot, so it will be replaced by a fresh Assistant." : "This cannot be undone."));
    dlg.append(el("div", "sect", "Removed"));
    const gone = el("ul"), items = [n("messages", "message", "messages") && n("messages", "message", "messages") + " in the chat", n("tasks", "phone task", "phone tasks") && n("tasks", "phone task", "phone tasks") + " with their screenshots",
      n("routines", "routine", "routines") && n("routines", "routine", "routines") + " (they stop running)", n("memories", "remembered fact", "remembered facts"), n("screenshots", "library screenshot", "library screenshots")].filter(Boolean);
    for (const t of items.length ? items : ["Its chat history and settings"]) gone.append(el("li", "", t)); dlg.append(gone);
    if (info.running) dlg.append(el("div", "sub", "Its running phone task will be stopped first."));
    dlg.append(el("div", "sect", "Kept"));
    const keep = el("ul"), li = (t) => { const x = el("li", "keep"); x.append(el("span", "", t)); return x; };
    keep.append(li(`Saved secrets (${info.secrets}): they belong to you and are shared by all bots`), li("The phone, its apps and the Google account signed in on it")); dlg.append(keep);
    let box = null;
    if (info.last && info.secrets) {
      const lab = el("label", "opt"); box = el("input"); box.type = "checkbox"; lab.append(box, el("span", "", `Also erase all ${info.secrets} saved secrets and their use history`)); dlg.append(lab);
    }
    const acts = el("div", "acts"), no = el("button", "", "Cancel"), yes = el("button", "danger solid", "Delete");
    const done = (ok) => { dlg.close(); dlg.remove(); resolve(ok ? { erase: !!(box && box.checked) } : null); };
    no.onclick = () => done(false); yes.onclick = () => done(true); dlg.addEventListener("cancel", (e) => { e.preventDefault(); done(false); });
    acts.append(no, yes); dlg.append(acts); document.body.append(dlg); dlg.showModal(); no.focus();
  });
}
async function deleteBot(bot) {
  try {
    const choice = await askDelete(bot, await api(`/api/bots/${bot.id}/delete-preview`)); if (!choice) return;
    const r = await api(`/api/bots/${bot.id}` + (choice.erase ? "?erase_secrets=true" : ""), undefined, "DELETE");
    S.bots = await api("/api/bots");
    if (S.bot && S.bot.id === bot.id) { S.bot = null; renderBots(); selectBot(r.bot ? r.bot.id : S.bots[0].id); } else renderBots();
    if (S.tab === "vault") renderTab();

}
$("searchBtn").onclick = () => { const b = $("searchBox"); b.hidden = !b.hidden; if (!b.hidden) $("searchInput").focus(); };
$("searchInput").oninput = (e) => { S.filter = e.target.value; renderBots(); };
// window.prompt() is blocked in some embedded browsers, so bot details are collected in a normal dialog.
function botForm(title, name, persona, okLabel) {
  return new Promise((resolve) => {
    const dlg = el("dialog"), form = el("form"), n = el("input"), p = el("textarea");
    n.placeholder = "Name, e.g. Research"; n.maxLength = 60; n.value = name || ""; n.required = true; n.setAttribute("aria-label", "Bot name");
    p.placeholder = "What should it focus on? (optional)"; p.maxLength = 4000; p.rows = 3; p.value = persona || ""; p.setAttribute("aria-label", "Focus");
    p.style.cssText = n.style.cssText = "width:100%;margin-top:8px;box-sizing:border-box;resize:vertical";
    const acts = el("div", "acts"), no = el("button", "", "Cancel"), yes = el("button", "primary", okLabel); no.type = "button"; yes.type = "submit";
    const done = (v) => { dlg.close(); dlg.remove(); resolve(v); };
    no.onclick = () => done(null); dlg.addEventListener("cancel", (e) => { e.preventDefault(); done(null); });
    form.onsubmit = (e) => { e.preventDefault(); if (n.value.trim()) done({ name: n.value.trim(), persona: p.value.trim() }); };
    acts.append(no, yes); form.append(el("h3", "", title), n, p, acts); dlg.append(form); document.body.append(dlg); dlg.showModal(); n.focus(); n.select();
  });
}
$("newBtn").onclick = async () => {
  const v = await botForm("New bot", "", "", "Create"); if (!v) return;
  try { const b = await api("/api/bots", { ...v, greet: true }); await loadBots(); await selectBot(b.id); S.thinking = true; renderFeed(true); } catch (e) { toast(e.message); }
};
$("menuBtn").onclick = () => $("app").classList.toggle("show-side");
$("panelBtn").onclick = () => $("app").classList.toggle("show-panel");

async function selectBot(id) {
  if (S.es) S.es.close();
  const st = await api(`/api/bots/${id}/state`);
  S.bot = st.bot; markSeen(id, Math.max(0, ...st.messages.map(m => m.id))); S.msgs = new Map(st.messages.map(m => [m.id, m])); S.thinking = false; S.mobile = st.mobile;
  renderBots(); renderHeader(); renderFeed(true); renderTab();
  S.es = new EventSource(`/api/bots/${id}/events?after=${st.last_seq}` + (token ? "&" + tq() : ""));
  S.es.onmessage = (e) => onEvent(JSON.parse(e.data));
}
function onEvent(ev) {
  if (ev.type === "message") {
    const m = ev.message;
    if (m.role === "assistant" && m.kind !== "status") S.thinking = false;
    S.msgs.set(m.id, m); renderFeed(); if (m.kind === "text" || m.kind === "result") loadBotsSoon();
    if (m.kind === "action_item" && m.meta.status === "open") pollMobile();
  } else if (ev.type === "message_delete") { S.msgs.delete(ev.id); renderFeed(); }
  else if (ev.type === "refresh" && ((ev.what === "routines" && S.tab === "details") || (ev.what === "vault" && S.tab === "vault"))) renderTab();
  if (S.tab === "library") renderTab();
}
let botsTimer; function loadBotsSoon() { clearTimeout(botsTimer); botsTimer = setTimeout(loadBots, 400); }

// ---------- header / feed ----------
function renderHeader() {
  const b = S.bot; if (!b) return;
  $("hAv").replaceWith(Object.assign(avatar(b, "sm"), { id: "hAv" }));
  $("pAv").replaceWith(Object.assign(avatar(b, "lg"), { id: "pAv", style: "margin:0 auto;background:" + b.color }));
  $("hName").textContent = $("pName").textContent = b.name;
  $("hSub").textContent = "Muse Spark 1.3 · phone worker Muse Wonder";
}
// The feed is rebuilt on every event (the phone task posts a status update each step), so what the owner is typing into a card must survive it.
S.drafts = new Map();
function draft(input, key) {
  input.dataset.draft = key; input.value = S.drafts.get(key) || "";
  input.addEventListener("input", () => S.drafts.set(key, input.value));
  return input;
}
// Make http(s) links in text messages clickable without ever treating message text as HTML.
function linkified(node, text) {
  const re = /https?:\/\/[^\s<>"')\]]+[^\s<>"')\].,;:!?]/g; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) node.append(text.slice(last, m.index));
    const a = el("a", "", m[0]); a.href = m[0]; a.target = "_blank"; a.rel = "noopener noreferrer"; node.append(a); last = m.index + m[0].length;
  }
  node.append(text.slice(last)); return node;
}
function renderFeed(jump) {
  const feed = $("feed"), nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140;
  const a = document.activeElement, focusKey = a && a.dataset ? a.dataset.draft : null, caret = focusKey ? [a.selectionStart, a.selectionEnd] : null;
  feed.replaceChildren();
  const list = [...S.msgs.values()].sort((a, b) => a.id - b.id);
  if (!list.length) {
    const e = el("div", "empty"); e.append(avatar(S.bot, "lg"), el("h2", "", S.bot ? S.bot.name : ""), el("div", "", "Ask for something. If it needs the phone, I'll do it in the background and show it on the right."));
    e.firstChild.style.margin = "0 auto"; feed.append(e);
  }
  for (const m of list) {
    if (m.kind === "status") feed.append(statusLine(m));
    else if (m.kind === "action_item") feed.append(card(m));
    else if (m.kind === "bot_note") feed.append(el("div", "botnote", m.content));
    else if (m.kind === "alert") {
      const c = el("div", "alertcard"), body = el("div"); body.append(el("b", "", "Needs attention"), el("div", "", m.content));
      if (m.meta && m.meta.bot_id) { const go = el("button", "", "Open " + (m.meta.bot || "bot")); go.onclick = () => selectBot(m.meta.bot_id); body.append(go); }
      c.append(body); feed.append(c);
    }
    else {
      feed.append(linkified(el("div", "msg " + m.role), m.content));
      if (m.meta && m.meta.sensitive) {
        const h = el("div", "hint", "Hidden before sending: " + m.meta.sensitive.join(", ") + ".");
        feed.append(h);
      }
    }
  }
  $("text").placeholder = S.thinking || list.some(m => m.kind === "status") ? "Working… type to add or change something" : "Message";
  if (S.thinking && !list.some(m => m.kind === "status")) { const s = el("div", "status"); s.append(dots(), el("span", "", "Thinking")); feed.append(s); }

}
function dots() { const d = el("span", "dots"); d.append(el("b"), el("b"), el("b")); return d; }
function statusLine(m) {

  s.append(stop); return s;
}

// ---------- action cards ----------
const KIND = { confirm: "Needs your approval", choice: "Your choice", text: "Quick question", handoff: "Your turn on the phone", otp: "One-time code", secret: "Secure input" };
function card(m) {

  c.append(el("div", "k", open ? KIND[meta.kind] || "Action needed" : meta.status === "answered" ? "Answered" : meta.status === "expired" ? "Expired: no answer in time, the task was stopped" : "No longer needed"), el("div", "q", m.content));
  if (!open) { if (meta.status === "answered" && meta.answer) c.append(el("div", "ans", meta.answer)); return c; }

  } else if (meta.kind === "handoff") {

    const b = el("button", "primary", "Take control"); b.onclick = () => openOverlay({ control: true, handoff: meta.item_id }); row.append(b);
  } else if (meta.kind === "secret") {

    nm.placeholder = "Name, e.g. netflix password"; nm.maxLength = 60; nm.setAttribute("aria-label", "Name");

    const go = () => { if (!v.value || (!meta.label && !nm.value.trim())) return; const body = { secret: v.value, label: nm.value.trim() }; v.value = ""; S.drafts.delete(meta.item_id + ":value"); S.drafts.delete(meta.item_id + ":name"); v.disabled = b.disabled = true; send(body).finally(() => { v.disabled = b.disabled = false; }); };
    b.onclick = go; d.onclick = () => send({ approved: false }); v.onkeydown = (e) => { if (e.key === "Enter") go(); };
    if (!meta.label) row.append(nm); row.append(v, b, d);

    const i = draft(el("input"), meta.item_id + ":code"); i.inputMode = "numeric"; i.maxLength = 8; i.placeholder = "Code"; i.autocomplete = "one-time-code"; i.setAttribute("aria-label", "One-time code");
    const b = el("button", "primary", "Send code"), d = el("button", "danger", "Decline");
    const go = () => /^\d{4,8}$/.test(i.value.trim()) ? send({ code: i.value.trim() }) : toast("Enter the 4 to 8 digit code");
    b.onclick = go; d.onclick = () => send({ approved: false }); i.onkeydown = (e) => { if (e.key === "Enter") go(); }; row.append(i, b, d);

// ---------- composer ----------
const ta = $("text");
ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 160) + "px"; });
ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = ta.value.trim(); if (!text || !S.bot) return;
  ta.value = ""; ta.style.height = "auto"; S.thinking = true;
  try { const m = await api(`/api/bots/${S.bot.id}/messages`, { text }); S.msgs.set(m.id, m); renderFeed(true); }
  catch (err) { S.thinking = false; toast(err.message); ta.value = text; }

// ---------- speech to text (Muse Voice Transcribe) ----------
// The browser records, converts to the 16 kHz mono 16-bit WAV the API requires, and the server forwards it. The text lands in the box for review; nothing is sent automatically.
const MAX_REC_SECONDS = 180;

    const end = d.moved ? frac(e, true) : d; if (d.moved) { pending = null; sendTouch("move", end); }
    sendTouch("up", end); if (!d.moved) ripple(e, dt >= 450 ? "long" : ""); burst(); return;
  }
  if (!d.moved && dt < 450) { ripple(e); phone("/api/device/tap", { fx: d.fx, fy: d.fy }); }
  else if (!d.moved) { ripple(e, "long"); phone("/api/device/swipe", { fx1: d.fx, fy1: d.fy, fx2: d.fx, fy2: d.fy, ms: Math.min(1500, Math.round(dt)) }); }  // press and hold
  else { const t = frac(e, true); ripple(e); phone("/api/device/swipe", { fx1: d.fx, fy1: d.fy, fx2: t.fx, fy2: t.fy, ms: Math.min(900, Math.max(80, Math.round(dt))) }); }
});
let wheel = { x: 0, y: 0, timer: null };
$("ovScreen").addEventListener("wheel", (e) => {
  if (!holding()) return; e.preventDefault();
  const k = e.deltaMode === 1 ? 16 : 1; wheel.x += e.deltaX * k; wheel.y += e.deltaY * k;
  if (wheel.timer) return;
  wheel.timer = setTimeout(() => {
    const h = $("ovImg").getBoundingClientRect().height || 600, dy = Math.max(-0.6, Math.min(0.6, wheel.y / h * 1.5)), dx = Math.max(-0.6, Math.min(0.6, wheel.x / h * 1.5));
    wheel = { x: 0, y: 0, timer: null };
    if (Math.abs(dy) < 0.03 && Math.abs(dx) < 0.03) return;
    // wheel down reveals content further down, so the finger moves up
    phone("/api/device/swipe", { fx1: 0.5 + dx / 2, fy1: 0.5 + dy / 2, fx2: 0.5 - dx / 2, fy2: 0.5 - dy / 2, ms: 160 });
  }, 90);
}, { passive: false });

let typed = "", typeTimer = null;
function flushTyped() { clearTimeout(typeTimer); typeTimer = null; const t = typed; typed = ""; for (let i = 0; i < t.length; i += 500) phone("/api/device/type", { text: t.slice(i, i + 500) }); }
const SPECIAL = { Backspace: "delete", Delete: "forward_delete", Enter: "enter", Tab: "tab", ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", PageUp: "page_up", PageDown: "page_down", Escape: "back" };
const inField = (e) => /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
document.addEventListener("keydown", (e) => {
  if (!holding() || inField(e) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.length === 1) { e.preventDefault(); typed += e.key; if (!typeTimer) typeTimer = setTimeout(flushTyped, 60); return; }  // batch fast typing into one call
  if (SPECIAL[e.key]) { e.preventDefault(); flushTyped(); phone("/api/device/key", { key: SPECIAL[e.key] }); }
});
document.addEventListener("paste", (e) => {
  if (!holding() || inField(e)) return;
  const t = e.clipboardData.getData("text"); if (t) { e.preventDefault(); typed += t; flushTyped(); }
});

loadBots(); pollMobile(); setInterval(loadBots, 6000);
</script>
