<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Mobile Agent</title>
<!-- Fonts: Geist and Geist Mono, SIL OFL, see /fonts. -->
<style>
  @font-face { font-family: "Geist"; src: url("/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url("/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    color-scheme: dark;
    /* ink ramp: deepest, page, card, raised */
    --ink-0: #07080d; --ink-1: #0b0d14; --ink-2: #11141c; --ink-3: #1a1e28;
    --line: #eef0f514; --line-2: #eef0f524;
    --text: #eef0f5; --text-2: #a3a9b8; --text-3: #868ea1;
    /* amber means one thing: a lane is working, or something needs you */
    --amber: #f0a43a; --amber-ink: #1a1206; --amber-wash: #f0a43a1f; --amber-line: #f0a43a59;
    --ok: #4cc38a; --bad: #ef6a70;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --dw: clamp(120px, 7.2vw, 168px);  /* width of a portrait device on the bench; a landscape one is 2.2 times that */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ink-1); color: var(--text); font: 400 14px/1.5 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  button { font: inherit; font-weight: 500; color: var(--text); background: var(--ink-3); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 12px; cursor: pointer; transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease); }
  button:hover:not(:disabled) { background: #222735; border-color: #eef0f533; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--text); border-color: var(--text); color: var(--ink-1); }
  button.primary:hover:not(:disabled) { background: #fff; border-color: #fff; }
  button.ghost { background: transparent; border-color: transparent; padding: 8px; color: var(--text-2); }
  button.ghost:hover:not(:disabled) { background: var(--ink-3); border-color: transparent; color: var(--text); }
  button.danger { color: var(--bad); }
  input, textarea, select { font: inherit; color: var(--text); background: var(--ink-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 12px; }
  input::placeholder, textarea::placeholder { color: var(--text-3); }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
  .mono { font-family: var(--mono); }

  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr) clamp(420px, 34vw, 640px); height: 100vh; }

  /* lane lamp: the one signature. Lit amber while a lane works, steady amber when it waits for you, dim when idle, hollow when off. */
  .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-2); flex: none; display: inline-block; }
  .lamp.on { background: var(--amber); animation: lamp 2s var(--ease) infinite; }
  .lamp.wait { background: transparent; box-shadow: inset 0 0 0 2px var(--amber); }
  .lamp.idle { background: var(--text-3); box-shadow: none; }
  .lamp.asleep { background: var(--ink-3); box-shadow: inset 0 0 0 1px var(--text-3); }
  .lamp.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }
  @keyframes lamp { 50% { opacity: .4; } }
  /* A bot that is working (or waiting for the owner) has a glow flowing around its box; its text is left alone. */
  @property --glow-angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @keyframes glowflow { to { --glow-angle: 360deg; } }
  .bot.working, .bot.awaiting { --glow: rgba(238, 240, 245, .85); position: relative; }
  .bot.awaiting { --glow: var(--amber); }
  .bot.working::before, .bot.awaiting::before, .bot.working::after, .bot.awaiting::after {
    content: ""; position: absolute; inset: -1px; border-radius: 11px; pointer-events: none;
    background: conic-gradient(from var(--glow-angle), transparent 0 55%, color-mix(in srgb, var(--glow) 30%, transparent) 72%, var(--glow) 88%, transparent 100%);
    animation: glowflow 2.6s linear infinite;
  }
  .bot.working::before, .bot.awaiting::before {  /* the crisp line: the gradient shows only in a 1.5px ring around the box */
    padding: 1.5px; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }
  .bot.working::after, .bot.awaiting::after { filter: blur(9px); opacity: .45; z-index: -1; }  /* the soft light spilling outside it */
  @media (prefers-reduced-motion: reduce) {  /* no movement: a steady ring says the same thing */
    .bot.working::before, .bot.awaiting::before { animation: none; background: var(--glow); opacity: .55; }
    .bot.working::after, .bot.awaiting::after { display: none; }
  }

  /* sidebar */
  .side { background: var(--ink-0); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side header { display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px 16px; }
  .brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .brand svg { width: 24px; height: 24px; flex: none; fill: none; stroke: var(--text-3); stroke-width: 1.5; stroke-linecap: round; }
  .brand svg .lit { fill: var(--amber); stroke: var(--amber); }
  .side header h1 { margin: 0; font-size: 15px; font-weight: 500; }
  .side .label { padding: 12px 16px 4px; font-size: 12px; color: var(--text-3); }
  .search { margin: 0 12px 8px; }
  .search input { width: 100%; }
  .bots { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .botrow { position: relative; }
  .bot { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px; min-height: 48px; border: 1px solid transparent; background: transparent; border-radius: 10px; font-weight: 400; }
  .bot:hover:not(:disabled) { background: var(--ink-2); border-color: transparent; }
  .bot.sel, .bot.sel:hover { background: var(--ink-2); border-color: var(--line-2); }
  .av { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--ink-3); border: 1px solid var(--line-2); color: var(--text-2); font-size: 13px; font-weight: 500; }
  .av .ico { width: 16px; height: 16px; }
  .av.lg { width: 40px; height: 40px; border-radius: 10px; } .av.lg .ico { width: 20px; height: 20px; }
  .bot.sel .av, .av.master { color: var(--text); }
  .bot .t { min-width: 0; flex: 1; }
  .bot .n { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bot .p { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .botrow .bot { padding-right: 40px; }
  .botrow.tagged .bot .n { margin-right: 52px; }
  .botrow.offline .n { color: var(--text-2); }
  .botrow .tag { position: absolute; right: 40px; top: 12px; font: 400 12px var(--mono); color: var(--text-3); pointer-events: none; }
  .botrow .more { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px; display: grid; place-items: center; color: var(--text-3); background: transparent; opacity: 0; transition: opacity .15s var(--ease), background .15s var(--ease); }
  .botrow .more svg { width: 16px; height: 16px; fill: currentColor; }
  .botrow:hover .more, .botrow .more.open, .botrow .more:focus-visible { opacity: 1; }
  .botrow .more:hover:not(:disabled), .botrow .more.open { background: var(--ink-3); color: var(--text); border-color: transparent; }
  .botrow:hover .unread { visibility: hidden; }
  .unread { min-width: 8px; height: 8px; border-radius: 50%; background: var(--text); flex: none; }
  .side footer { padding: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  /* The account row: a round avatar with a lamp for the phones, the name, and one quiet status line. */
  .side footer .who { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; background: var(--ink-2); }
  .side footer .who .av.owner { width: 36px; height: 36px; border-radius: 50%; font: 500 14px var(--sans, inherit); color: var(--text); background: var(--ink-3); position: relative; flex: none; }
  .side footer .who .av.owner::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--text-3); box-shadow: 0 0 0 2px var(--ink-2); }
  .side footer .who.working .av.owner::after { background: var(--amber); }
  .side footer .who.waiting .av.owner::after, .side footer .who.control .av.owner::after { background: var(--ink-2); box-shadow: 0 0 0 2px var(--ink-2), inset 0 0 0 2px var(--amber); }
  .side footer .who .whotxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .side footer .who .name { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.2; }
  .side footer .who .chip { font: 400 12px var(--mono); color: var(--text-2); }
  .side footer .who .chip i { display: none; }  /* the lamp is on the avatar */
  .chip { display: inline-flex; align-items: center; gap: 8px; font: 400 12px var(--mono); color: var(--text-2); }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); display: block; }
  .chip.ready i { background: var(--text-3); } .chip.working i { background: var(--amber); animation: lamp 2s var(--ease) infinite; }
  .chip.waiting i, .chip.control i { background: transparent; box-shadow: inset 0 0 0 2px var(--amber); } .chip.sleeping i { background: transparent; box-shadow: inset 0 0 0 1px var(--text-3); }
  .chip.off i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); } .chip.waking i { background: var(--amber); animation: lamp 2s var(--ease) infinite; }

  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: var(--ink-3); color: var(--text); border: 1px solid var(--bad); padding: 12px 16px; border-radius: 10px; z-index: 100; font-size: 13px; max-width: 90vw; box-shadow: 0 12px 32px #000a; }
  dialog { background: var(--ink-2); color: var(--text); border: 1px solid var(--line-2); border-radius: 14px; padding: 24px; width: min(440px, 92vw); box-shadow: 0 24px 64px #000b; }
  dialog::backdrop { background: #000a; }
  dialog h3 { margin: 0 0 8px; font-size: 18px; font-weight: 500; } dialog .sub { color: var(--text-2); font-size: 13px; margin-bottom: 12px; }
  dialog .sect { font-size: 12px; color: var(--text-3); margin: 16px 0 4px; }
  dialog ul { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.6; } dialog li.keep { list-style: "\2713  "; color: var(--ok); } dialog li.keep span { color: var(--text); }
  dialog label.opt { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; padding: 12px; border: 1px solid var(--line-2); border-radius: 10px; font-size: 13px; cursor: pointer; }
  dialog .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  dialog button.danger.solid { background: var(--bad); color: var(--ink-0); border-color: var(--bad); }
  /* connectors: the directory of apps the agent can use through MCP */
  .sidelink { display: flex; align-items: center; gap: 12px; margin: 4px 8px 8px; padding: 8px; border: 1px solid transparent; background: transparent; border-radius: 10px; color: var(--text-2); font-weight: 400; text-align: left; }
  .sidelink:hover:not(:disabled) { background: var(--ink-2); border-color: transparent; color: var(--text); }
  .sidelink .av { background: transparent; }
  .sidelink .t { flex: 1; min-width: 0; font-size: 14px; }
  .sidelink .count { font: 400 12px var(--mono); color: var(--text-3); }
  dialog.conn { width: min(860px, 94vw); height: min(720px, 90vh); max-width: none; max-height: none; padding: 0; overflow: hidden; }
  dialog.conn[open] { display: flex; flex-direction: column; }
  .conn [hidden] { display: none !important; }
  .conn .chead { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line); flex: none; }
  .conn .chead .sbox { flex: 1; min-width: 0; position: relative; }
  .conn .chead .sbox .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
  .conn .chead input[type=search] { width: 100%; padding-left: 36px; background: var(--ink-1); }
  .conn .chead h3 { flex: 1; margin: 0; font-size: 15px; }
  .conn .pills { display: flex; gap: 8px; padding: 12px 16px 0; overflow-x: auto; flex: none; scrollbar-width: none; }
  .conn .pills::-webkit-scrollbar { display: none; }
  .conn .pill { flex: none; padding: 6px 14px; border-radius: 999px; background: transparent; border: 1px solid var(--line-2); color: var(--text-2); font-size: 13px; font-weight: 400; }
  .conn .pill[aria-pressed=true] { background: var(--ink-3); color: var(--text); border-color: #eef0f533; }
  .conn .cbody { flex: 1; overflow-y: auto; padding: 8px 16px 16px; min-height: 0; }
  .conn .csec { margin-top: 20px; }
  .conn .csec h4 { margin: 0 0 6px; font-size: 14px; font-weight: 500; }
  .conn .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; }
  .conn .crow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 1px solid transparent; background: transparent; border-radius: 12px; text-align: left; font-weight: 400; min-height: 56px; }
  .conn .crow:hover:not(:disabled) { background: var(--ink-3); border-color: transparent; }
  .conn .tile { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; font-size: 15px; font-weight: 600; }
  .conn .tile.lg { width: 48px; height: 48px; border-radius: 12px; font-size: 20px; }
  .conn .tile .ico { width: 18px; height: 18px; }
  .conn .ctxt { flex: 1; min-width: 0; }
  .conn .ctxt .n { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conn .ctxt .b { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conn .cact { flex: none; font-size: 13px; padding: 4px 12px; border-radius: 8px; background: var(--ink-3); border: 1px solid var(--line-2); color: var(--text); }
  .conn .crow:hover .cact { background: #222735; }
  .conn .cact.ok { background: transparent; border-color: transparent; color: var(--ok); padding-right: 0; }
  .conn .cact.warn { background: transparent; border-color: transparent; color: var(--amber); padding-right: 0; }
  .conn .cempty { color: var(--text-3); padding: 32px 0; text-align: center; }
  .conn .cfoot { flex: none; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3); }
  .conn .detail { max-width: 600px; margin: 8px auto 0; display: flex; flex-direction: column; gap: 16px; }
  .conn .dhead { display: flex; align-items: center; gap: 16px; }
  .conn .dhead h3 { margin: 0; font-size: 20px; }
  .conn .dhead .b { color: var(--text-2); font-size: 14px; }
  .conn .dstate { font-size: 13px; } .conn .dstate.ok { color: var(--ok); } .conn .dstate.warn { color: var(--amber); }
  .conn .dsec h5 { margin: 0 0 8px; font-size: 12px; font-weight: 500; color: var(--text-3); }
  .conn .tools { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .conn .tools li { display: flex; gap: 12px; align-items: baseline; padding: 8px 12px; background: var(--ink-1); }
  .conn .tools .tn { font: 400 12px var(--mono); color: var(--text); flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
  .conn .tools .td { flex: 1; min-width: 0; color: var(--text-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn .tools .chip { flex: none; font: 400 11px var(--mono); padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--text-2); }
  .conn .tools .chip.ask { color: var(--amber); border-color: var(--amber-line); }
  .conn .hint { align-self: stretch; display: block; max-width: none; color: var(--text-3); font-size: 12px; }
  .conn .hint a { color: var(--text-2); }
  .conn form.kform { display: flex; flex-direction: column; gap: 12px; }
  .conn .field { display: flex; flex-direction: column; gap: 4px; }
  .conn .field label { font-size: 13px; color: var(--text-2); }
  .conn .field input, .conn .field select { width: 100%; }
  .conn .warnnote { color: var(--amber); font-size: 12px; }
  .conn .cerr { color: var(--bad); font-size: 13px; padding: 8px 12px; border: 1px solid #ef6a7059; border-radius: 10px; background: #ef6a701a; }
  .conn .cacts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .conn .cacts .primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
  .conn .cacts button:disabled { opacity: .6; cursor: default; }
  .conn .sure { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--text-2); }
  .conn .cseg { display: flex; gap: 4px; margin: 12px 16px 0; padding: 3px; width: max-content; max-width: calc(100% - 32px); background: var(--ink-1); border: 1px solid var(--line); border-radius: 999px; flex: none; }
  .conn .cseg button { padding: 5px 16px; border-radius: 999px; background: transparent; border: 1px solid transparent; color: var(--text-2); font-size: 13px; font-weight: 400; }
  .conn .cseg button[aria-selected=true] { background: var(--ink-3); color: var(--text); border-color: var(--line-2); }
  .agents { max-width: 680px; margin: 8px auto 0; display: flex; flex-direction: column; gap: 20px; }
  .agents > p.lead { margin: 0; color: var(--text-2); font-size: 14px; }
  .agents h4 { margin: 0 0 8px; font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .agents h4 small { color: var(--text-3); font: 400 12px var(--mono); }
  .agents .box { border: 1px solid var(--line); border-radius: 12px; background: var(--ink-1); padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .agents .arow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .agents .arow .t { min-width: 0; flex: 1 1 220px; } .agents .arow .t b { font-weight: 500; display: block; }
  .agents .arow .t span { color: var(--text-3); font-size: 12px; overflow-wrap: anywhere; }
  .agents .lamp { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); vertical-align: 0; }
  .agents .lamp.on { background: var(--ok); box-shadow: none; }
  .agents .addr { display: flex; gap: 8px; align-items: center; }
  .agents .addr label { flex: none; width: 82px; font-size: 12px; color: var(--text-3); }
  .agents .addr code, .agents .tokfield { flex: 1; min-width: 0; font: 400 12px/1.5 var(--mono); color: var(--text-2); background: var(--ink-0); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; }
  .agents .btn { flex: none; font-size: 12px; padding: 4px 12px; border-radius: 8px; }
  .agents a.btn { display: inline-block; text-decoration: none; border: 1px solid var(--line-2); background: var(--ink-3); color: var(--text); }
  .agents .aclient { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; flex-wrap: wrap; }
  .agents .aclient.gone { opacity: .55; }
  .agents .aclient .ctxt { flex: 1 1 200px; min-width: 0; } .agents .aclient .n { font-weight: 500; overflow-wrap: anywhere; }
  .agents .aclient .b { color: var(--text-3); font-size: 12px; }
  .agents .sc { display: inline-block; font: 400 11px var(--mono); padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--text-2); margin: 4px 4px 0 0; }
  .agents .sc.phone { color: var(--amber); border-color: var(--amber-line); }
  .agents .aclient .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .agents .field { display: flex; flex-direction: column; gap: 4px; } .agents .field label { font-size: 13px; color: var(--text-2); } .agents .field input[type=text], .agents .field input[type=number] { width: 100%; }
  .agents .checks { display: flex; flex-direction: column; gap: 8px; }
  .agents .checks label { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--text-2); }
  .agents .checks input { margin-top: 3px; flex: none; } .agents .checks b { color: var(--text); font-weight: 500; }
  .agents .tokbox { border-color: var(--amber-line); }
  .agents .tokbox .tokfield { color: var(--text); user-select: all; }
  .agents .cmd { font: 400 12px/1.5 var(--mono); }
  .agents .atask { display: flex; width: 100%; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--ink-1); text-align: left; font-weight: 400; flex-wrap: wrap; }
  .agents .atask:hover { background: var(--ink-3); }
  .agents .atask .who { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; } .agents .atask .when { color: var(--text-3); font: 400 11px var(--mono); }
  .agents .atask .sk { color: var(--text-3); font: 400 11px var(--mono); }
  .agents .tasks { display: flex; flex-direction: column; gap: 4px; }
  .agents .spill { flex: none; font: 400 11px var(--mono); padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--text-3); }

<script>
// No picture on this page may ever show as a broken image: a failed load hides it, a later successful load shows it again (error and load do not bubble, so listen while capturing).
document.addEventListener("error", (e) => { if (e.target && e.target.tagName === "IMG") e.target.classList.add("broken"); }, true);
document.addEventListener("load", (e) => { if (e.target && e.target.tagName === "IMG") e.target.classList.remove("broken"); }, true);
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };

let token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
try { token = token || sessionStorage.getItem("token") || ""; if (token) sessionStorage.setItem("token", token); } catch {}
if (location.hash) history.replaceState(null, "", location.pathname);
$("token").addEventListener("change", (e) => { token = e.target.value.trim(); try { sessionStorage.setItem("token", token); } catch {} loadBots(); });

const auth = () => token ? { Authorization: "Bearer " + token } : {};
async function api(path, body, method) {
  const r = await fetch(path, { method: method || (body === undefined ? "GET" : "POST"), headers: { "Content-Type": "application/json", ...auth() }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401) { $("token").style.display = ""; throw new Error("Access token required"); }
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(typeof e.detail === "string" ? e.detail : r.statusText); }
  return r.json();
}
const tq = () => token ? "token=" + encodeURIComponent(token) : "";

// Native alert/confirm/prompt are blocked in some embedded browsers, so errors and confirmations use these.
function toast(msg) {
  const t = el("div", "toast", msg); document.body.append(t); setTimeout(() => t.remove(), 5000);
}
function sure(title, text, okLabel) {
  return new Promise((resolve) => {
    const dlg = el("dialog"), acts = el("div", "acts"), no = el("button", "", "Cancel"), yes = el("button", "danger solid", okLabel || "Delete");
    const done = (v) => { dlg.close(); dlg.remove(); resolve(v); };
    no.onclick = () => done(false); yes.onclick = () => done(true); dlg.addEventListener("cancel", (e) => { e.preventDefault(); done(false); });
    acts.append(no, yes); dlg.append(el("h3", "", title), el("div", "sub", text || ""), acts); document.body.append(dlg); dlg.showModal(); no.focus();
  });
}
const S = { bots: [], bot: null, msgs: new Map(), es: null, tab: "mobile", mobile: { state: "ready" }, thinking: false, filter: "", control: null };

// ---------- bots ----------
const initial = (n) => (n || "?").trim().slice(0, 1).toUpperCase();
// One line-icon set (16 px grid, 1.5 stroke). Static markup only: no message text ever goes through innerHTML.
const ICO = {
  master: '<path d="M8 2l6 3-6 3-6-3z"/><path d="M2 8l6 3 6-3M2 11l6 3 6-3"/>',
  chat: '<path d="M3 4.5A1.5 1.5 0 014.5 3h7A1.5 1.5 0 0113 4.5v5a1.5 1.5 0 01-1.5 1.5H8l-3 2.5V11h-.5A1.5 1.5 0 013 9.5z"/>',
  games: '<rect x="2" y="5" width="12" height="7" rx="3"/><path d="M5.5 7.5v2M4.5 8.5h2M10.5 8h.01M12 9.5h.01"/>',
  phone: '<rect x="4.5" y="1.5" width="7" height="13" rx="1.8"/><path d="M7 12.5h2"/>',
  moon: '<path d="M13 9.5A5.5 5.5 0 016.5 3a5.5 5.5 0 106.5 6.5z"/>', power: '<path d="M8 2v5M4.7 4.5a5 5 0 106.6 0"/>',
};
const icon = (name, cls) => `<svg class="ico ${cls || ""}" viewBox="0 0 16 16" aria-hidden="true">${ICO[name]}</svg>`;
function avatar(bot, cls) {
  const a = el("div", "av " + (cls || "") + (bot.kind === "master" ? " master" : "")), k = bot.kind === "master" ? "master" : bot.kind === "virtual" ? "games" : bot.kind === "phone" ? "phone" : "";
  if (k) a.innerHTML = icon(k); else a.textContent = initial(bot.name);
  return a;
}

// Unread badges and notifications: remember the last message the owner has seen in each bot (per browser).
try { S.seen = JSON.parse(localStorage.getItem("seen") || "{}"); } catch { S.seen = {}; }
S.notified = {}; S.waitNotified = {};
const saveSeen = () => { try { localStorage.setItem("seen", JSON.stringify(S.seen)); } catch {} };
function markSeen(bot, lastId) { if (!bot || lastId === undefined || (S.seen[bot] || 0) >= lastId) return; S.seen[bot] = lastId; saveSeen(); }
document.addEventListener("click", () => { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {}); }, { once: true });
async function loadBots() {
  try { S.bots = await api("/api/bots"); } catch (e) { return; }
  let unread = 0;
  for (const b of S.bots) {
    if (S.seen[b.id] === undefined) S.seen[b.id] = b.last_id;      // first visit: nothing is "new"
    if (S.bot && S.bot.id === b.id) S.seen[b.id] = Math.max(S.seen[b.id], b.last_id);
    b.unread = b.last_id > S.seen[b.id]; if (b.unread) unread++;
    if (S.notified[b.id] === undefined) S.notified[b.id] = b.last_id;
    else if (b.unread && b.last_id > S.notified[b.id]) {
      S.notified[b.id] = b.last_id;
      if (b.kind === "master" && "Notification" in window && Notification.permission === "granted") { try { new Notification("Master bot", { body: b.last, tag: "master" }); } catch {} }
    }
  }
  const waitingBots = S.bots.filter(b => b.active === "waiting");
  for (const b of waitingBots) {  // a task is waiting for the owner: tell them even when this tab is in the background
    if (!S.waitNotified[b.id]) {
      S.waitNotified[b.id] = true;
      if (document.hidden && "Notification" in window && Notification.permission === "granted") {
        try { const n = new Notification("Waiting for you: " + b.name, { body: b.last || "A task needs your answer", tag: "wait-" + b.id }); n.onclick = () => { window.focus(); selectBot(b.id); n.close(); }; } catch {}
      }
    }
  }
  for (const id of Object.keys(S.waitNotified)) if (!waitingBots.some(b => b.id === id)) delete S.waitNotified[id];
  saveSeen(); document.title = (waitingBots.length ? "\u25CF Needs you \u00B7 " : unread ? `(${unread}) ` : "") + "Mobile Agent";
  renderBots(); renderBench(); pollBench();
  if (!S.bot && S.bots.length) selectBot(S.bots[0].id);
}
function renderBots() {
  const list = $("bots"); list.replaceChildren();
  const q = S.filter.toLowerCase();
  for (const b of S.bots.filter(b => !q || b.name.toLowerCase().includes(q))) {
    const btn = el("button", "bot" + (S.bot && S.bot.id === b.id ? " sel" : ""));
    btn.append(avatar(b));
    const t = el("div", "t"); t.append(el("div", "n", b.name), el("div", "p", b.last || "No messages yet")); btn.append(t);
    if (b.active) { btn.classList.add(b.active === "waiting" ? "awaiting" : "working"); btn.title = b.active === "waiting" ? "Waiting for you" : "Working"; }
    btn.onclick = () => { selectBot(b.id); $("app").classList.remove("show-side"); };
    const row = el("div", "botrow" + (b.kind === "master" ? " master" : "")), more = el("button", "more");
    if (b.kind === "master") row.append(el("span", "tag", "master"));
    if (b.kind === "phone") { const up = phoneUp(b); if (!up) { row.append(el("span", "tag", "offline")); row.classList.add("offline"); } }  // a phone bot whose phone is not connected is quiet
    if (b.kind === "virtual" && b.phone_id !== "games") row.append(el("span", "tag", "extra"));
    if (row.querySelector(".tag")) row.classList.add("tagged");  // the name stops before the tag instead of running under it
    if (b.unread && !(S.bot && S.bot.id === b.id)) btn.append(el("span", "unread"));
    more.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>';
    more.setAttribute("aria-label", "Bot options");
    more.onclick = (e) => { e.stopPropagation(); openMenu(row, more, b); };
    row.append(btn, more); list.append(row);
  }
}
function closeMenu() { document.querySelectorAll(".menu").forEach(m => m.remove()); document.querySelectorAll(".more.open").forEach(m => m.classList.remove("open")); }
document.addEventListener("click", closeMenu);
const closeSide = () => $("app").classList.remove("show-side");
const closePanel = () => { $("app").classList.remove("show-panel"); if (typeof syncPanelBtn === "function") syncPanelBtn(); };
$("sideClose").onclick = closeSide;
$("scrim").onclick = () => { closeSide(); closePanel(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMenu(); closeSide(); closePanel(); } });
function openMenu(row, more, bot) {
  const was = more.classList.contains("open"); closeMenu(); if (was) return;
  more.classList.add("open");
  const m = el("div", "menu"), ren = el("button"), del = el("button", "danger");
  ren.innerHTML = '<svg viewBox="0 0 16 16"><path d="M2.5 13.5l.7-3L11 2.7a1.4 1.4 0 012 2L5.5 12.8z"/></svg>Rename';
  del.innerHTML = '<svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>Delete';
  m.setAttribute("role", "menu"); ren.onclick = () => renameBot(bot); del.onclick = () => deleteBot(bot);
  m.append(ren); if (bot.kind !== "master") m.append(del); row.append(m);
}
