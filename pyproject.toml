[project]
name = "mobile-agent"
version = "0.1.0"
description = "Always-on proactive agent that operates a cloud Android device with Meta models"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.18",
    "pillow>=10",
    "uiautomator2>=3.7.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.setuptools]
packages = ["agent"]
